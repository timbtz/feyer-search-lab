name: Experiment infrastructure checks
on:
  push:
    paths: ['lab/**', 'tests/**', '.github/workflows/lab-tests.yml']
  pull_request:
    paths: ['lab/**', 'tests/**', '.github/workflows/lab-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lab/*.py
